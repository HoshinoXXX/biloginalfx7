name: Build BiloginalfX7

# 方案B 用的 workflow：假设仓库里已经有完整源码
# （Tweak.xm / Makefile / control / BiloginalfX7.plist / Core/*.h Core/*.m）
# 本文件只负责编译，所以很短。
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查源码是否齐全
        run: |
          set -e
          echo "--- 仓库文件 ---"
          find . -path ./.git -prune -o -type f -print | sort
          MISSING=""
          for f in Tweak.xm Makefile control BiloginalfX7.plist \
                   BRLog.m BRStore.m BRSession.m \
                   BRRouter.m BRURLProtocol.m; do
            if [ ! -f "$f" ]; then echo "!! 缺少 $f"; MISSING=1; fi
          done
          if [ -n "$MISSING" ]; then echo "源码不齐：请把工程文件上传到仓库根目录"; exit 1; fi
          echo "源码齐全"

      - name: 安装 theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: 安装 iOS SDK（必须含 9.3，armv7 靠它）
        run: |
          set -e
          mkdir -p "$HOME/theos/sdks"
          cd /tmp
          git clone --depth 1 https://github.com/theos/sdks.git sdkrepo
          find /tmp/sdkrepo -maxdepth 2 -name "*.sdk" -type d -print0 \
            | while IFS= read -r -d '' d; do cp -R "$d" "$HOME/theos/sdks/" 2>/dev/null || true; done
          ls -1 "$HOME/theos/sdks"
          [ -d "$HOME/theos/sdks/iPhoneOS9.3.sdk" ] || { echo "!! 缺少 9.3 SDK"; exit 1; }

      - name: 修复旧 SDK 的 liblaunch 缺失
        run: |
          set +e
          for V in 9.3 10.3; do
            SDK="$HOME/theos/sdks/iPhoneOS${V}.sdk"
            [ -d "$SDK" ] || continue
            for f in "$SDK/usr/lib/system/libSystem.tbd" "$SDK/usr/lib/libSystem.tbd"; do
              [ -f "$f" ] && sed -i '' '/liblaunch\.dylib/d' "$f" 2>/dev/null
            done
            STUB="$SDK/usr/lib/system/liblaunch.tbd"
            if [ ! -f "$STUB" ]; then
              printf '%s\n' \
                '--- !tapi-tbd-v3' \
                'archs:                 [ armv7, armv7s, arm64 ]' \
                'platform:              ios' \
                'install-name:          /usr/lib/system/liblaunch.dylib' \
                'current-version:       1' \
                'compatibility-version: 1' \
                'exports:' \
                '  - archs:             [ armv7, armv7s, arm64 ]' \
                '    symbols:           [ ]' \
                '    objc-classes:      [ ]' \
                '    objc-ivars:        [ ]' \
                '...' > "$STUB"
            fi
          done
          exit 0

      - name: 安装 ldid
        run: |
          set +e
          command -v ldid >/dev/null 2>&1 || brew install ldid 2>&1 | tail -3
          exit 0

      - name: 编译
        run: |
          set -o pipefail
          make package FINALPACKAGE=1 DEBUG=0 2>&1 | tail -160

      - name: 收集产物
        run: |
          mkdir -p out
          find packages -name "*.deb" -exec cp {} out/ \; 2>/dev/null || true
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "=== 没有产出 deb ==="
            ls -laR .theos/obj 2>/dev/null | head -40 || true
            exit 1
          fi
          ls -la out/

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: biloginalfx7-deb
          path: out/*.deb
          if-no-files-found: error
