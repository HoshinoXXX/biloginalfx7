name: Build Probe

# 单文件版（v3）：本文件已内联全部源码，运行时会自动展开并编译。
#
# 依赖处理（踩过的两个坑）：
#   1) ldid 在 Ubuntu 官方源里不存在 -> "E: Unable to locate package ldid"
#      改用 MOZGIII/install-ldid-action（直接从 GitHub Releases 下载二进制）
#   2) theos-action 内部有路径 bug -> "mv: 目标 'Theos/SDKS' 没有此文件或目录"
#      改为手写 theos 安装，每步都显式可控
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 展开内联源码
        run: |
          set -e
          mkdir -p "$(dirname 'src/Tweak.xm')"
          cat > 'src/Tweak.xm' << 'BILIFIX_EOF_MARKER_7f3a'
          //
          //  Tweak.xm —— BiloginalfX7 探针（Probe）
          //
          //  ★ 目的：先搞清楚 4.34 到底走哪个网络入口，再决定架构。
          //
          //  背景：此前的 4.34 插件（BiliFix7.dylib）只 hook 了
          //        +sendSynchronousRequest:returningResponse:error:
          //        +sendAsynchronousRequest:queue:completionHandler:
          //  但如果客户端实际用的是 delegate 方式（-initWithRequest:delegate:），
          //  那两个 hook 就是**完全无效**的 —— 插件看起来装了，实际一点作用没有。
          //
          //  所以这里把**所有可能的出口**都挂上探针，每个只记录一行日志、
          //  **不改变任何行为**。装上看日志即可判断：
          //    · 哪个入口有输出  ->  4.34 用的是它
          //    · 全都没有输出    ->  走的是更底层（CFNetwork C API / 自研库），
          //                          那就只能继续用本地代理方案
          //
          //  日志：/var/mobile/biloginalfx7.log（或 Console.app 过滤 BiloginalfX7）
          //

          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>
          #import <substrate.h>
          #import <CFNetwork/CFNetwork.h>

          #import "Core/BRLog.h"

          static NSMutableSet *gSeen = nil;

          static void BRNote(NSString *tag, NSURL *url) {
              static dispatch_once_t once;
              dispatch_once(&once, ^{ gSeen = [NSMutableSet set]; });
              NSString *u = url.absoluteString ?: @"(nil)";
              // 同一 URL 只记一次，避免刷屏
              NSString *key = [NSString stringWithFormat:@"%@|%@", tag, u];
              if ([gSeen containsObject:key]) return;
              [gSeen addObject:key];
              if ([gSeen count] > 800) [gSeen removeAllObjects];
              BRLogWrite(@"[探针] %@  %@", tag, u);
          }

          #pragma mark - NSURLConnection：类方法

          static NSData *(*o_sendSync)(id, SEL, NSURLRequest *, NSURLResponse **, NSError **);
          static NSData *h_sendSync(id self, SEL _cmd, NSURLRequest *req,
                                    NSURLResponse **resp, NSError **err) {
              BRNote(@"+sendSynchronousRequest", req.URL);
              return o_sendSync(self, _cmd, req, resp, err);
          }

          static void (*o_sendAsync)(id, SEL, NSURLRequest *, NSOperationQueue *,
                                     void (^)(NSURLResponse *, NSData *, NSError *));
          static void h_sendAsync(id self, SEL _cmd, NSURLRequest *req, NSOperationQueue *q,
                                  void (^h)(NSURLResponse *, NSData *, NSError *)) {
              BRNote(@"+sendAsynchronousRequest", req.URL);
              o_sendAsync(self, _cmd, req, q, h);
          }

          #pragma mark - NSURLConnection：实例方法（delegate 方式）

          static id (*o_initWithRequest)(id, SEL, NSURLRequest *, id);
          static id h_initWithRequest(id self, SEL _cmd, NSURLRequest *req, id delegate) {
              BRNote(@"-initWithRequest:delegate:", req.URL);
              return o_initWithRequest(self, _cmd, req, delegate);
          }

          static id (*o_initWithRequestStart)(id, SEL, NSURLRequest *, id, BOOL);
          static id h_initWithRequestStart(id self, SEL _cmd, NSURLRequest *req, id delegate,
                                           BOOL startNow) {
              BRNote(@"-initWithRequest:delegate:startImmediately:", req.URL);
              return o_initWithRequestStart(self, _cmd, req, delegate, startNow);
          }

          static void (*o_start)(id, SEL);
          static void h_start(id self, SEL _cmd) {
              @try {
                  NSURLRequest *req = [self valueForKey:@"originalRequest"];
                  if (req == nil) req = [self valueForKey:@"_originalRequest"];
                  if (req != nil) BRNote(@"-start", req.URL);
              } @catch (NSException *e) { }
              o_start(self, _cmd);
          }

          #pragma mark - NSURLSession

          static id (*o_dataTaskWithRequest)(id, SEL, NSURLRequest *);
          static id h_dataTaskWithRequest(id self, SEL _cmd, NSURLRequest *req) {
              BRNote(@"NSURLSession -dataTaskWithRequest:", req.URL);
              return o_dataTaskWithRequest(self, _cmd, req);
          }

          static id (*o_dataTaskWithRequestCompletion)(id, SEL, NSURLRequest *,
                                                       void (^)(NSData *, NSURLResponse *, NSError *));
          static id h_dataTaskWithRequestCompletion(id self, SEL _cmd, NSURLRequest *req,
                                                    void (^cb)(NSData *, NSURLResponse *, NSError *)) {
              BRNote(@"NSURLSession -dataTaskWithRequest:completionHandler:", req.URL);
              return o_dataTaskWithRequestCompletion(self, _cmd, req, cb);
          }

          #pragma mark - CFNetwork（C API，最底层兜底）

          static CFReadStreamRef (*o_cfReadStream)(CFAllocatorRef, CFHTTPMessageRef);
          static CFReadStreamRef h_cfReadStream(CFAllocatorRef alloc, CFHTTPMessageRef msg) {
              @try {
                  NSURL *u = (__bridge NSURL *)CFHTTPMessageCopyRequestURL(msg);
                  if (u != nil) BRNote(@"CFReadStreamCreateForHTTPRequest", u);
              } @catch (NSException *e) { }
              return o_cfReadStream(alloc, msg);
          }

          static CFReadStreamRef (*o_cfReadStreamForStream)(CFAllocatorRef, CFReadStreamRef);
          static CFReadStreamRef h_cfReadStreamForStream(CFAllocatorRef alloc, CFReadStreamRef s) {
              BRNote(@"CFReadStreamCreateForStreamedHTTPRequest", nil);
              return o_cfReadStreamForStream(alloc, s);
          }

          #pragma mark - 装载

          %ctor
          {
              @autoreleasepool {
                  BRLogInit();
                  BRLogWrite(@"===== BiloginalfX7 探针已加载 =====");

                  Class conn = objc_getClass("NSURLConnection");
                  if (conn != nil) {
                      MSHookMessageEx(conn, @selector(sendSynchronousRequest:returningResponse:error:),
                                      (IMP)&h_sendSync, (IMP *)&o_sendSync);
                      MSHookMessageEx(conn, @selector(sendAsynchronousRequest:queue:completionHandler:),
                                      (IMP)&h_sendAsync, (IMP *)&o_sendAsync);
                      MSHookMessageEx(conn, @selector(initWithRequest:delegate:),
                                      (IMP)&h_initWithRequest, (IMP *)&o_initWithRequest);
                      MSHookMessageEx(conn, @selector(initWithRequest:delegate:startImmediately:),
                                      (IMP)&h_initWithRequestStart, (IMP *)&o_initWithRequestStart);
                      MSHookMessageEx(conn, @selector(start), (IMP)&h_start, (IMP *)&o_start);
                      BRLogWrite(@"[探针] NSURLConnection 已挂载（5 个入口）");
                  }

                  Class sess = objc_getClass("NSURLSession");
                  if (sess != nil) {
                      MSHookMessageEx(sess, @selector(dataTaskWithRequest:),
                                      (IMP)&h_dataTaskWithRequest, (IMP *)&o_dataTaskWithRequest);
                      MSHookMessageEx(sess, @selector(dataTaskWithRequest:completionHandler:),
                                      (IMP)&h_dataTaskWithRequestCompletion,
                                      (IMP *)&o_dataTaskWithRequestCompletion);
                      BRLogWrite(@"[探针] NSURLSession 已挂载");
                  }

                  MSHookFunction((void *)CFReadStreamCreateForHTTPRequest,
                                 (void *)h_cfReadStream, (void **)&o_cfReadStream);
                  MSHookFunction((void *)CFReadStreamCreateForStreamedHTTPRequest,
                                 (void *)h_cfReadStreamForStream, (void **)&o_cfReadStreamForStream);
                  BRLogWrite(@"[探针] CFNetwork 已挂载");

                  BRLogWrite(@"[探针] 安装完成 —— 现在打开哔哩哔哩，操作几下，然后查看日志");
              }
          }
          BILIFIX_EOF_MARKER_7f3a
          mkdir -p "$(dirname 'src/Makefile')"
          cat > 'src/Makefile' << 'BILIFIX_EOF_MARKER_7f3a'
          # BiloginalfX7 探针 —— 只挂载探针、不改变任何网络行为
          # 编译：make package   （或用 .github/workflows/build.yml 在 GitHub 上自动编译）
          export ARCHS = armv7 arm64
          export TARGET = iphone:clang:latest:7.0

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = BiloginalfX7Probe
          BiloginalfX7Probe_FILES = Tweak.xm Core/BRLog.m
          BiloginalfX7Probe_CFLAGS = -fobjc-arc
          BiloginalfX7Probe_FRAMEWORKS = Foundation UIKit CoreFoundation

          include $(THEOS_MAKE_PATH)/tweak.mk
          BILIFIX_EOF_MARKER_7f3a
          mkdir -p "$(dirname 'src/control')"
          cat > 'src/control' << 'BILIFIX_EOF_MARKER_7f3a'
          Package: com.hoshinoxxx.biloginalfx7probe
          Name: BiloginalfX7 探针
          Version: 0.1.0
          Section: Tweaks
          Maintainer: HoshinoXXX
          Author: HoshinoXXX
          Architecture: iphoneos-arm
          Depends: mobilesubstrate | cydia-substrate, firmware (>= 7.0)
          Tag: purpose::extension
          Description: 哔哩哔哩 4.34 网络入口探针（诊断用，不改变任何行为）
           只挂载以下网络出口的探针，每个仅记录一行日志：
            * NSURLConnection 类方法（sendSynchronousRequest / sendAsynchronousRequest）
            * NSURLConnection 实例方法（initWithRequest:delegate: / -start）
            * NSURLSession（dataTaskWithRequest: / ...completionHandler:）
            * CFNetwork C API（CFReadStreamCreateForHTTPRequest / ...ForStreamedHTTPRequest）
           .
           用途：确定 4.34 实际走哪个网络入口，以决定插件架构。
           日志：/var/mobile/biloginalfx7.log
          BILIFIX_EOF_MARKER_7f3a
          mkdir -p "$(dirname 'src/BiloginalfX7Probe.plist')"
          cat > 'src/BiloginalfX7Probe.plist' << 'BILIFIX_EOF_MARKER_7f3a'
          {
              Filter = {
                  Bundles = (
                      "tv.danmaku.bilianime",
                      "tv.danmaku.bilianimeHD",
                      "tv.danmaku.bilibiliHD",
                      "com.bilibili.bilianime"
                  );
              };
          }
          BILIFIX_EOF_MARKER_7f3a
          mkdir -p "$(dirname 'src/Core/BRLog.h')"
          cat > 'src/Core/BRLog.h' << 'BILIFIX_EOF_MARKER_7f3a'
          //
          //  BRLog.h —— 轻量日志（可开关、限流）
          //
          #import <Foundation/Foundation.h>

          void BRLogInit(void);
          BOOL BRLogEnabled(void);

          // 日志写入 /var/mobile/biloginalfx7.log（越狱环境可写）；
          // 写不了就退化为 NSLog（Xcode / Console.app 可见）。
          void BRLogWrite(NSString *fmt, ...) NS_FORMAT_FUNCTION(1, 2);

          #define BRINFO(...) BRLogWrite(@"[I] " __VA_ARGS__)
          #define BRDBG(...)  do { if (BRLogEnabled()) BRLogWrite(@"[D] " __VA_ARGS__); } while (0)
          #define BRERR(...)  BRLogWrite(@"[E] " __VA_ARGS__)
          BILIFIX_EOF_MARKER_7f3a
          mkdir -p "$(dirname 'src/Core/BRLog.m')"
          cat > 'src/Core/BRLog.m' << 'BILIFIX_EOF_MARKER_7f3a'
          #import "BRLog.h"
          #import <stdarg.h>

          static BOOL gEnabled = YES;
          static NSString *gLogPath = nil;
          static NSLock *gLock = nil;
          // 高频日志限流：同一行内容 30 秒内只记一次
          static NSMutableDictionary *gThrottle = nil;

          void BRLogInit(void) {
              static dispatch_once_t once;
              dispatch_once(&once, ^{
                  gLock = [[NSLock alloc] init];
                  gThrottle = [NSMutableDictionary dictionary];
                  // 越狱环境可直接写；不可写时退化为 NSLog
                  for (NSString *p in @[@"/var/mobile/biloginalfx7.log",
                                        @"/tmp/biloginalfx7.log"]) {
                      if ([[NSFileManager defaultManager] isWritableFileAtPath:
                           [p stringByDeletingLastPathComponent]]) {
                          gLogPath = p;
                          break;
                      }
                  }
                  if (gLogPath == nil) {
                      gEnabled = NO;   // 只走 NSLog
                  }
              });
          }

          BOOL BRLogEnabled(void) { return gEnabled; }

          void BRLogWrite(NSString *fmt, ...) {
              va_list ap;
              va_start(ap, fmt);
              NSString *msg = [[NSString alloc] initWithFormat:fmt arguments:ap];
              va_end(ap);
              if (msg == nil) return;

              // 限流：相同内容 30 秒内只写一次
              [gLock lock];
              NSDate *now = [NSDate date];
              NSDate *last = [gThrottle objectForKey:msg];
              if (last != nil && [now timeIntervalSinceDate:last] < 30.0) {
                  [gLock unlock];
                  return;
              }
              [gThrottle setObject:now forKey:msg];
              if ([gThrottle count] > 400) [gThrottle removeAllObjects];

              NSDateFormatter *df = [[NSDateFormatter alloc] init];
              [df setDateFormat:@"MM-dd HH:mm:ss"];
              NSString *line = [NSString stringWithFormat:@"[%@] %@\n",
                                [df stringFromDate:now], msg];
              [gLock unlock];

              NSLog(@"[BiloginalfX7] %@", msg);

              if (gLogPath != nil) {
                  NSFileHandle *fh = [NSFileHandle fileHandleForWritingAtPath:gLogPath];
                  if (fh == nil) {
                      [line writeToFile:gLogPath atomically:NO
                               encoding:NSUTF8StringEncoding error:NULL];
                  } else {
                      @try {
                          [fh seekToEndOfFile];
                          [fh writeData:[line dataUsingEncoding:NSUTF8StringEncoding]];
                          [fh closeFile];
                      } @catch (NSException *e) { }
                  }
              }
          }
          BILIFIX_EOF_MARKER_7f3a

          echo "--- 生成的文件 ---"
          find src -type f | sort

      - name: 基础工具
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl git make clang xz-utils zip unzip fakeroot dpkg-dev perl

      - name: 安装 ldid
        uses: MOZGIII/install-ldid-action@v1
        with:
          tag: v2.1.5-procursus2

      - name: 确认 ldid 可用
        run: ldid -v || ldid || echo "(ldid 已就位)"

      - name: 安装 theos
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "--- theos 目录 ---"
          ls -la "$HOME/theos" | head -20

      - name: 安装 iOS SDK
        run: |
          set -e
          mkdir -p "$HOME/theos/sdks"
          cd /tmp
          git clone --depth 1 https://github.com/theos/sdks.git sdkrepo
          # 官方仓库里是一些 .sdk 目录；全部拷过去
          find /tmp/sdkrepo -maxdepth 2 -name "*.sdk" -type d -print0 \
            | while IFS= read -r -d '' d; do
                cp -R "$d" "$HOME/theos/sdks/" 2>/dev/null || true
              done
          echo "--- 可用 SDK ---"
          ls -1 "$HOME/theos/sdks" | head -30
          if [ -z "$(ls -A "$HOME/theos/sdks")" ]; then
            echo "!! SDK 目录为空，编译会失败"
            echo "--- sdkrepo 内容 ---"
            find /tmp/sdkrepo -maxdepth 2 | head -40
            exit 1
          fi

      - name: 编译
        run: |
          cd src
          make package FINALPACKAGE=1 DEBUG=0 2>&1 | tail -100

      - name: 收集产物
        run: |
          mkdir -p out
          find src/packages -name "*.deb" -exec cp {} out/ \; 2>/dev/null || true
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "=== 没有产出 deb，诊断信息如下 ==="
            echo "--- src/packages ---"
            ls -laR src/packages 2>/dev/null || echo "(不存在)"
            echo "--- src/.theos ---"
            ls -laR src/.theos 2>/dev/null | head -60 || echo "(不存在)"
            echo "--- theos 根 ---"
            ls -la "$HOME/theos" 2>/dev/null | head -20 || echo "(不存在)"
            echo "--- SDK ---"
            ls -1 "$HOME/theos/sdks" 2>/dev/null || echo "(无)"
            echo "--- which ldid ---"
            which ldid || echo "(找不到 ldid)"
            exit 1
          fi
          ls -la out/

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: probe-deb
          path: out/*.deb
          if-no-files-found: error
