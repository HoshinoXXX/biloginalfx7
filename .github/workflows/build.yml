name: Build BiloginalfX7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检查源文件是否齐全
        run: |
          set -e
          echo "--- 仓库文件 ---"
          ls -la
          echo ""
          miss=0
          for f in Makefile control B18Probe.xm B19Probe.xm B18Probe.plist B19Probe.plist BHelper.h \
                   BRCrypto.h BRLog.h BRLog.m BRStore.h BRStore.m BRSession.h BRSession.m \
                   BRRouter.h BRRouter.m BRURLProtocol.h BRURLProtocol.m; do
            if [ ! -f "$f" ]; then
              echo "!! 缺少 $f"
              miss=1
            fi
          done
          if [ "$miss" = "1" ]; then
            echo "源码不齐：请把工程文件上传到仓库根目录"
            exit 1
          fi
          echo "源码齐全，开始构建"

      - name: 安装 Theos
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          brew install ldid
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: 修补 9.3 SDK 的 liblaunch
        run: |
          set -e
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          TBD="$SDK/usr/lib/system/liblaunch.tbd"

          grep -rl 'liblaunch' "$SDK" --include='*.tbd' 2>/dev/null | while read -r f; do
            if [ "$f" != "$TBD" ]; then
              sed -i '' '/liblaunch/d' "$f" || true
            fi
          done

          printf -- '--- !tapi-tbd-v2\narchs: [ armv7 ]\nplatform: ios\ntargets: [ armv7-ios ]\ninstall-name: "/usr/lib/system/liblaunch.dylib"\ncurrent-version: 1\ncompatibility-version: 1\nexports:\n  - archs: [ armv7 ]\n    symbols: [ ]\n' > "$TBD"

          echo "--- liblaunch.tbd 修补完成 ---"
          cat "$TBD"

      - name: 编译打包
        run: |
          set -e
          make package FINALPACKAGE=1 DEBUG=0

      - name: 列出产物
        run: |
          ls -la packages/ || true

      - name: 上传 deb
        uses: actions/upload-artifact@v4
        with:
          name: biloginalfx7-deb
          path: packages/*.deb
          if-no-files-found: error
