name: Build QQ Probe (no Theos)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'qqprobe/**'
      - '.github/workflows/qqprobe-clang.yml'
  workflow_dispatch:

jobs:
  build:
    # macOS runners are not allocated for this account (jobs are cancelled with
    # no runner assigned), so build on ubuntu-latest. Theos is not used: the
    # probe is one small dylib, so clang is invoked directly against an iOS SDK
    # and the deb is assembled with dpkg-deb. ARC is deliberately off because
    # the 9.x SDK has no libarclite for deployment targets below 10.5.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm dpkg xz-utils curl

      - name: Fetch iOS SDK
        run: |
          set -e
          mkdir -p /tmp/sdks
          curl -L --retry 3 -o /tmp/sdks.tar.gz \
            https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp/sdks
          echo "--- available SDKs ---"
          find /tmp/sdks -maxdepth 2 -name "*.sdk" -type d | sort | sed 's#.*/##'
          SDK=$(find /tmp/sdks -maxdepth 2 -name "iPhoneOS9.3.sdk" -type d | head -1)
          if [ -z "$SDK" ]; then
            echo "9.3 not present, choosing the oldest available"
            SDK=$(find /tmp/sdks -maxdepth 2 -name "*.sdk" -type d | sort | head -1)
          fi
          echo "SDK=$SDK"
          echo "SDK_PATH=$SDK" >> "$GITHUB_ENV"
          ls "$SDK" | head -20

      - name: Build dylib (MRC, no ARC)
        run: |
          set -e
          mkdir -p out
          clang --version | head -2
          echo "SDK_PATH=$SDK_PATH"

          set +e
          clang -target armv7-apple-ios7.0 \
            -isysroot "$SDK_PATH" \
            -Wno-deprecated-declarations \
            -Wno-objc-root-class \
            -Wno-unused-function \
            -dynamiclib \
            -install_name /Library/MobileSubstrate/DynamicLibraries/QQProbe.dylib \
            -o out/QQProbe.dylib \
            qqprobe/QQProbe.xm \
            -framework Foundation -framework UIKit \
            -undefined dynamic_lookup 2>&1 | tail -40
          RC=$?
          set -e

          if [ $RC -ne 0 ] || [ ! -f out/QQProbe.dylib ]; then
            echo "=== retry with ld64.lld ==="
            clang -target armv7-apple-ios7.0 \
              -isysroot "$SDK_PATH" \
              -Wno-deprecated-declarations \
              -Wno-objc-root-class \
              -dynamiclib \
              -install_name /Library/MobileSubstrate/DynamicLibraries/QQProbe.dylib \
              -o out/QQProbe.dylib \
              qqprobe/QQProbe.xm \
              -framework Foundation -framework UIKit \
              -undefined dynamic_lookup \
              -fuse-ld=/usr/bin/ld64.lld 2>&1 | tail -40 || true
          fi

          echo "--- result ---"
          ls -l out/ || true
          if [ -f out/QQProbe.dylib ]; then
            dd if=out/QQProbe.dylib bs=1 count=8 2>/dev/null | od -An -tx1
          else
            echo "!! no dylib produced"
            exit 1
          fi

      - name: Build deb
        run: |
          set -e
          ROOT=$PWD/debroot
          rm -rf "$ROOT"
          mkdir -p "$ROOT/Library/MobileSubstrate/DynamicLibraries"
          mkdir -p "$ROOT/DEBIAN"
          cp out/QQProbe.dylib "$ROOT/Library/MobileSubstrate/DynamicLibraries/"
          cp qqprobe/QQProbe.plist "$ROOT/Library/MobileSubstrate/DynamicLibraries/"
          {
            echo "Package: com.qqprobe.probe"
            echo "Name: QQ Probe (read-only)"
            echo "Version: 0.1"
            echo "Architecture: iphoneos-arm"
            echo "Description: Read-only ObjC runtime probe for QQ 6.2. Dumps class and method lists into /tmp. Modifies nothing."
            echo "Maintainer: qqprobe"
            echo "Author: qqprobe"
            echo "Section: Tweaks"
            echo "Depends: mobilesubstrate, firmware (>= 7.0)"
            echo "Installed-Size: 200"
          } > "$ROOT/DEBIAN/control"
          dpkg-deb -b "$ROOT" out/qqprobe.deb
          ls -l out/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: qqprobe-deb
          path: out/*.deb
          if-no-files-found: error
