name: Build QQ Probe

on:
  push:
    branches: [ main, master ]
    paths:
      - 'qqprobe/**'
      - '.github/workflows/qqprobe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify sources
        run: |
          set -e
          ls -la qqprobe/
          for f in Makefile control QQProbe.xm QQProbe.plist; do
            if [ ! -f "qqprobe/$f" ]; then
              echo "!! missing qqprobe/$f"
              exit 1
            fi
          done
          echo "sources ok"

      - name: Install Theos
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          brew install ldid
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Patch liblaunch in 9.3 SDK
        run: |
          set -e
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          TBD="$SDK/usr/lib/system/liblaunch.tbd"
          grep -rl 'liblaunch' "$SDK" --include='*.tbd' 2>/dev/null | while read -r f; do
            if [ "$f" != "$TBD" ]; then
              sed -i '' '/liblaunch/d' "$f" || true
            fi
          done
          printf -- '--- !tapi-tbd-v2\narchs: [ armv7 ]\nplatform: ios\ntargets: [ armv7-ios ]\ninstall-name: "/usr/lib/system/liblaunch.dylib"\ncurrent-version: 1\ncompatibility-version: 1\nexports:\n  - archs: [ armv7 ]\n    symbols: [ ]\n' > "$TBD"
          cat "$TBD"

      - name: Build package
        working-directory: qqprobe
        run: |
          set -e
          make package FINALPACKAGE=1 DEBUG=0

      - name: List artifacts
        run: ls -la qqprobe/packages/ || true

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: qqprobe-deb
          path: qqprobe/packages/*.deb
          if-no-files-found: error
