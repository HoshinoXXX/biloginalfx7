name: Build QQ Probe (macos-15)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'qqprobe/**'
      - '.github/workflows/qqprobe-mac.yml'
  workflow_dispatch:

jobs:
  build:
    # macos-14 (used since October) is no longer allocated for this account -
    # the probe workflow plus a four-way sweep showed macos-14 and macos-13 are
    # cancelled/queued with no runner, while macos-15 and macos-latest get one.
    # macOS is also the only place with a real ld64 that supports armv7, since
    # ld64.lld refuses -arch armv7 and cctools-port needs a libdispatch build.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          brew install ldid || true
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          ls "$THEOS/sdks" | head

      - name: Patch liblaunch in 9.3 SDK
        run: |
          set -e
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          TBD="$SDK/usr/lib/system/liblaunch.tbd"
          grep -rl 'liblaunch' "$SDK" --include='*.tbd' 2>/dev/null | while read -r f; do
            if [ "$f" != "$TBD" ]; then
              sed -i '' '/liblaunch/d' "$f" || true
            fi
          done
          printf -- '--- !tapi-tbd-v2\narchs: [ armv7 ]\nplatform: ios\ntargets: [ armv7-ios ]\ninstall-name: "/usr/lib/system/liblaunch.dylib"\ncurrent-version: 1\ncompatibility-version: 1\nexports:\n  - archs: [ armv7 ]\n    symbols: [ ]\n' > "$TBD"
          echo "patched liblaunch"

      - name: Build with Theos
        working-directory: qqprobe
        run: |
          make package FINALPACKAGE=1 DEBUG=0 2>&1 | tail -60
          ls -l packages/ || true

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: qqprobe-deb
          path: qqprobe/packages/*.deb
          if-no-files-found: error
